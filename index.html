<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SingularityNOW</title>
<style>
:root{--bg:#0b0d10;--card:#14181d;--line:#262c34;--ink:#f2f5f7;--dim:#98a2ad;--green:#76b900;--warn:#e6a23c;--danger:#ff6b6b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1b2a0b 0%,var(--bg) 60%);color:var(--ink);font:500 15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;min-height:100vh;-webkit-font-smoothing:antialiased}
main{width:min(420px,100%)}
.card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;display:none;flex-direction:column;gap:16px}
.card.active{display:flex}
h1{font-size:1.35rem;letter-spacing:.01em}
h1 b{color:var(--green)}
p{color:var(--dim)}
input{width:100%;background:#0b0d10;border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--ink);font:inherit;outline:none}
input:focus{border-color:var(--green)}
input.otp{font:700 1.4rem/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em;text-align:center}
form{display:flex;flex-direction:column;gap:14px}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--green);color:#0b0d10;text-align:center;text-decoration:none;display:block}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--dim)}
.err{color:var(--danger);font-size:.9rem}
.badge{display:inline-block;align-self:flex-start;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.8rem;color:var(--dim)}
.badge.ok{color:var(--green);border-color:var(--green)}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.big{font-size:1.1rem;font-weight:700;word-break:break-all}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);animation:s 1s linear infinite;align-self:center}
@keyframes s{to{transform:rotate(360deg)}}
.row{display:flex;gap:10px}.row>*{flex:1}
small{color:var(--dim)}
details{width:min(420px,100%);color:var(--dim);font-size:.8rem}
details summary{cursor:pointer;padding:4px 0}
details pre{background:#0b0d10;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin:8px 0;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main>
<section class="card active" id="boot"><div class="spin"></div><p id="boot-status" style="text-align:center">Loading…</p></section>
<section class="card" id="email-card">
<h1>Singularity<b>NOW</b></h1>
<p>Sign in to your existing GeForce NOW account. NVIDIA emails you a sign-in link, and everything goes through the browser proxy.</p>
<p class="err" id="email-error" hidden></p>
<form id="email-form">
<input id="email" type="email" inputmode="email" autocomplete="email" placeholder="NVIDIA account email" required>
<button class="btn" id="send" type="submit">Continue</button>
</form>
<small>Sign-in only. This client never creates accounts.</small>
</section>
<section class="card" id="wait-card">
<h1 id="wait-title">Working…</h1>
<p id="wait-desc"></p>
<div class="spin"></div>
<button class="btn ghost" id="cancel" type="button">Cancel</button>
</section>
<section class="card" id="code-card">
<h1 id="code-title">Enter your code</h1>
<p id="code-desc"></p>
<p class="err" id="code-error" hidden></p>
<form id="code-form">
<input class="otp" id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="••••••" required>
<button class="btn" id="verify" type="submit">Verify</button>
</form>
<button class="btn ghost" id="back" type="button">Cancel</button>
</section>
<section class="card" id="password-card">
<h1>Enter your password</h1>
<p id="pw-desc"></p>
<p class="err" id="pw-error" hidden></p>
<form id="pw-form">
<input id="pw" type="password" autocomplete="current-password" placeholder="NVIDIA account password" required>
<button class="btn" id="pw-submit" type="submit">Sign in</button>
</form>
<button class="btn ghost" id="pw-cancel" type="button">Cancel</button>
</section>
<section class="card" id="account">
<h1>Signed in</h1>
<div class="big" id="acct-email"></div>
<p id="acct-name"></p>
<span class="badge" id="acct-verified"></span>
<small id="acct-exp"></small>
<div class="row"><button class="btn ghost" id="copy-token">Copy access token</button><button class="btn ghost" id="signout">Sign out</button></div>
</section>
</main>
<details>
<summary>Debug log</summary>
<pre id="log"></pre>
<button class="btn ghost" id="copy-log" type="button">Copy log</button>
</details>
<script type="module">
const BAD_KEY = "WB_BAD";
const BAD_TTL_MS = 6 * 3600000;

function createBadList({ storage, now = () => Date.now(), ttl = BAD_TTL_MS, key = (entry) => String(entry) } = {}) {
  const box = () => {
    try { return storage || globalThis.localStorage || null; } catch { return null; }
  };
  const read = () => {
    const s = box();
    if (!s) return {};
    try {
      const v = JSON.parse(s.getItem(BAD_KEY));
      return v && typeof v === "object" && !Array.isArray(v) ? v : {};
    } catch { return {}; }
  };
  const live = () => {
    const t = now(), out = {};
    for (const [k, ts] of Object.entries(read())) if (typeof ts === "number" && t - ts < ttl) out[k] = ts;
    return out;
  };
  return {
    has: (entry) => Object.hasOwn(live(), key(entry)),
    add(entry) {
      const s = box();
      if (!s) return;
      const v = live();
      v[key(entry)] = now();
      try { s.setItem(BAD_KEY, JSON.stringify(v)); } catch {}
    },
    clear() {
      const s = box();
      try { if (s) s.removeItem(BAD_KEY); } catch {}
    },
  };
}

const KSTUFF = "lotsacookie/kstuff";
const STORAGE = "TongSherbet/storage";
const LIST_PATH = "Assets/json/wss.json";
const jsd = (repo) => [
  `https://cdn.jsdelivr.net/gh/${repo}@main/`,
  `https://fastly.jsdelivr.net/gh/${repo}@main/`,
  `https://gcore.jsdelivr.net/gh/${repo}@main/`,
];
const KSTUFF_MIRRORS = [...jsd(KSTUFF), `https://raw.githubusercontent.com/${KSTUFF}/main/`, `https://cdn.statically.io/gh/${KSTUFF}/main/`];
const STORAGE_MIRRORS = [...jsd(STORAGE), `https://raw.githubusercontent.com/${STORAGE}/main/`];
const BUILTIN = [
  "cdn.northstreetumc.org", "cdn.vipersfutbol.com", "cdn.pcesc.org", "cdn.kcchallengevbc.com",
  "cdn.slcbmooc.org", "cdn.topstargym.net", "cdn.goaplytexas.org", "cdn.clearfieldswimming.com",
  "wss://athollcottage.com/connection/", "wss://api.personalloanonline.net/ws/",
  "wss://kristenblackburnvolleyballcamps.com/socket/", "wss://southpadreislandkiteboarding.com/socket/",
];
const FALLBACK = "wss://api.personalloanonline.net/ws/";

const HOST_RE = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/i;
const WSS_RE = /^wss:\/\/[a-z0-9.-]+(:\d{1,5})?(\/[\w\-./]*)?$/i;
const isBackup = (e) => e.includes("://");
const toWss = (e) => {
  e = String(e || "").trim();
  if (!e) return null;
  const u = isBackup(e) ? e : `wss://${e}/`;
  return u.endsWith("/") ? u : u + "/";
};
const bad = createBadList({ key: toWss });
function decodeLoaderList(src, hostRe, wssRe, max, depth = 0) {
  if (depth > 3 || typeof src !== "string") return [];
  let code = null;
  try {
    const stub = new Proxy({}, { get: () => (a) => { if (code === null && typeof a === "string") code = a; } });
    new Function("globalThis", src)(stub);
  } catch {}
  if (!code) return [];
  const arrays = code.match(/\[(?:\s*"[^"\\]{3,120}"\s*,?)+\s*\]/g) || [];
  for (const arr of arrays) {
    let vals;
    try { vals = JSON.parse(arr.replace(/,\s*\]$/, "]")); } catch { continue; }
    const out = [];
    for (const v of vals) {
      const value = String(v).trim();
      if ((hostRe.test(value) || wssRe.test(value)) && !out.includes(value)) out.push(value);
      if (out.length >= max) break;
    }
    if (out.length >= 3 && out.length >= vals.length * 0.6) return out;
  }
  return decodeLoaderList(code, hostRe, wssRe, max, depth + 1);
}
function parseServerList(src, decode = (s) => decodeLoaderList(s, HOST_RE, WSS_RE, 32)) {
  if (typeof src !== "string") return [];
  const text = src.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
  const block = text.match(/serverList\s*=\s*\[([\s\S]*?)\]\s*[;,]/);
  if (!block) return decode(src);
  const item = /(["'])((?:\\.|(?!\1)[^\\])*)\1(\s*\.split\(\s*(?:""|'')\s*\)\s*\.reverse\(\)\s*\.join\(\s*(?:""|'')\s*\))?/g;
  const out = [];
  let m;
  while ((m = item.exec(block[1]))) {
    const value = (m[3] ? [...m[2]].reverse().join("") : m[2]).trim();
    if ((HOST_RE.test(value) || WSS_RE.test(value)) && !out.includes(value)) out.push(value);
    if (out.length >= 32) break;
  }
  return out;
}
function decodeInSandbox(src, ms = 4000) {
  return new Promise((resolve) => {
    const f = document.createElement("iframe");
    f.sandbox = "allow-scripts";
    f.style.display = "none";
    const done = (v) => { clearTimeout(t); removeEventListener("message", on); f.remove(); resolve(v); };
    const t = setTimeout(() => done([]), ms);
    const on = (e) => { if (e.source === f.contentWindow && e.data && e.data.wbDecoded) done(e.data.list || []); };
    addEventListener("message", on);
    f.srcdoc = `<script>const decode=${decodeLoaderList.toString()};` +
      `addEventListener("message",e=>{let l=[];try{l=decode(e.data.src,new RegExp(e.data.h,"i"),new RegExp(e.data.w,"i"),32)}catch{}` +
      `parent.postMessage({wbDecoded:1,list:l},"*")});parent.postMessage({wbReady:1},"*")<\/script>`;
    const ready = (e) => {
      if (e.source !== f.contentWindow || !e.data || !e.data.wbReady) return;
      removeEventListener("message", ready);
      f.contentWindow.postMessage({ src, h: HOST_RE.source, w: WSS_RE.source }, "*");
    };
    addEventListener("message", ready);
    document.body.append(f);
  });
}
const parseInBrowser = async (src) => parseServerList(src, (s) => decodeInSandbox(s));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
async function fetchWith(url, type, ms = 4000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store", signal: c.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r[type]();
  } finally { clearTimeout(t); }
}
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const b64ToText = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.trim()), (c) => c.charCodeAt(0)));
function parseWispList(json) {
  const b64 = Array.isArray(json) ? json.find((v) => typeof v === "string" && v.trim()) : json;
  if (typeof b64 !== "string") return [];
  let data;
  try { data = JSON.parse(b64ToText(b64)); } catch { return []; }
  const out = [];
  (function walk(v) {
    if (typeof v === "string" && /^wss:\/\//i.test(v.trim())) out.push(v.trim());
    else if (Array.isArray(v)) v.forEach(walk);
    else if (v && typeof v === "object") Object.values(v).forEach(walk);
  })(data);
  return [...new Set(out)];
}
async function fetchWispList(mirrors = KSTUFF_MIRRORS) {
  try { return parseWispList(await Promise.any(mirrors.map((m) => fetchWith(m + LIST_PATH, "json", 5000)))); }
  catch { return []; }
}
async function syncStorageList(mirrors = STORAGE_MIRRORS) {
  const cached = store.get("WB_SYNC");
  const cachedList = cached && Array.isArray(cached.list) ? cached.list.filter((u) => HOST_RE.test(u) || WSS_RE.test(u)) : [];
  if (cachedList.length && Date.now() - (cached.ts || 0) < 3600000) return cachedList;
  const failed = store.get("WB_SYNCF");
  if (failed && Date.now() - (failed.ts || 0) < 600000) return cachedList;
  for (const m of mirrors) {
    try {
      const list = await parseInBrowser(await fetchWith(m + "loader.js", "text", 3500));
      if (!list.length) throw new Error("no servers in loader.js");
      store.set("WB_SYNC", { ts: Date.now(), list });
      return list;
    } catch (e) { console.warn("[wisp] storage sync failed:", m, e && e.message || e); }
  }
  store.set("WB_SYNCF", { ts: Date.now() });
  return cachedList;
}
function probeWisp(entry, timeoutMs = 3000) {
  return new Promise((resolve) => {
    let ws;
    try { ws = new WebSocket(toWss(entry)); } catch { return resolve(null); }
    ws.binaryType = "arraybuffer";
    let connected = false, sentAt = 0;
    const streamId = (Math.floor(Math.random() * 0xFFFFFFFE) + 1) >>> 0;
    const finish = (ping) => { clearTimeout(timer); ws.onmessage = ws.onerror = ws.onclose = null; try { ws.close(); } catch {} resolve(ping); };
    const timer = setTimeout(() => finish(null), timeoutMs);
    ws.onmessage = (e) => {
      if (!(e.data instanceof ArrayBuffer) || e.data.byteLength < 5) return;
      const v = new DataView(e.data), type = v.getUint8(0), stream = v.getUint32(1, true);
      if (!connected) {
        if (type === 5 && stream === 0) ws.send(new Uint8Array([5, 0, 0, 0, 0, 2, 1]));
        else if (type === 3 && stream === 0) {
          connected = true;
          const host = new TextEncoder().encode("127.0.0.1");
          const buf = new ArrayBuffer(8 + host.length), dv = new DataView(buf);
          dv.setUint8(0, 1); dv.setUint32(1, streamId, true); dv.setUint8(5, 1); dv.setUint16(6, 69, true);
          new Uint8Array(buf).set(host, 8);
          sentAt = performance.now();
          ws.send(buf);
        }
        return;
      }
      if (stream === streamId) finish(Math.round(performance.now() - sentAt));
    };
    ws.onerror = ws.onclose = () => finish(null);
  });
}

async function firstAlive(entries, say, label, waveSize = 6) {
  const alive = [];
  for (let i = 0; i < entries.length && !alive.length; i += waveSize) {
    const wave = entries.slice(i, i + waveSize);
    say(`${label} (${Math.min(i + waveSize, entries.length)}/${entries.length})…`);
    const pings = await Promise.all(wave.map((e) => probeWisp(e)));
    wave.forEach((e, j) => { if (pings[j] !== null) alive.push({ entry: e, ping: pings[j] }); });
  }
  return alive.sort((a, b) => a.ping - b.ping)[0] || null;
}
function provisionalWisp(network) {
  const last = store.get("WB_LAST");
  const url = toWss(last && last.entry && !bad.has(last.entry) ? last.entry : FALLBACK);
  network.set_websocket(url);
  return url;
}
async function pickWisp(network, say = () => {}, opts = {}) {
  const budgetMs = opts.budgetMs || 15000;
  const excluded = new Set((opts.exclude || []).map(toWss));
  const allowed = (entry) => !excluded.has(toWss(entry));
  const prefer = (list) => {
    const ok = list.filter(allowed);
    return [...ok.filter((e) => !bad.has(e)), ...ok.filter((e) => bad.has(e))];
  };
  const apply = (entry) => {
    const url = toWss(entry);
    network.set_websocket(url);
    try { network.set_wisp_pool([url]); } catch {}
    store.set("WB_LAST", { entry, ts: Date.now() });
    return url;
  };
  const search = async () => {
    const last = store.get("WB_LAST");
    if (last && last.entry && allowed(last.entry) && !bad.has(last.entry) && Date.now() - last.ts < 600000 && (await probeWisp(last.entry)) !== null) return apply(last.entry);

    say("Syncing wisp list…");
    const synced = await syncStorageList(opts.storageBases ? [...opts.storageBases, ...STORAGE_MIRRORS.filter((m) => !opts.storageBases.includes(m))] : STORAGE_MIRRORS);
    const all = prefer([...new Set([...synced, ...BUILTIN])]);
    const primary = all.filter((e) => !isBackup(e));
    const hit = await firstAlive(primary, say, "Testing wisp servers");
    if (hit) return apply(hit.entry);

    say("Trying backup wisps…");
    const remote = await fetchWispList(opts.kstuffBases ? [...opts.kstuffBases, ...KSTUFF_MIRRORS.filter((m) => !opts.kstuffBases.includes(m))] : KSTUFF_MIRRORS);
    const backups = prefer([...new Set([...all.filter(isBackup), FALLBACK, ...shuffle(remote.filter((u) => !all.includes(u))).slice(0, 16)])]);
    const bhit = await firstAlive(backups, say, "Testing backup wisps");
    if (bhit) return apply(bhit.entry);
    return null;
  };
  const timeout = new Promise((r) => setTimeout(() => r(null), budgetMs));
  try {
    const url = await Promise.race([search(), timeout]);
    if (url) return url;
  } catch (e) { console.warn("[wisp] pick failed", e); }
  console.warn("[wisp] no wisp validated, using fallback");
  return apply([FALLBACK, ...BUILTIN.filter(isBackup)].find(allowed) || FALLBACK);
}

const DIST = "dist/sandstone.mjs";
const BASES = [
  "https://cdn.jsdelivr.net/gh/lotsacookie/Singuloxy@main/",
  "https://fastly.jsdelivr.net/gh/lotsacookie/Singuloxy@main/",
];

async function loadSandstone(log) {
  for (const base of BASES) {
    try { return await import(base + DIST); } catch { log("[proxy] sandstone import failed", base); }
  }
  const code = await (await fetch("https://raw.githubusercontent.com/lotsacookie/Singuloxy/main/" + DIST)).text();
  return import(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
}

let ready = null;
function getProxy({ log = () => {}, say = () => {} } = {}) {
  return (ready ||= (async () => {
    say("Loading proxy…");
    const sandstone = await loadSandstone(log);
    provisionalWisp(sandstone.network);
    for (let i = 0; i < 300 && !sandstone.libcurl.ready; i++) await new Promise((r) => setTimeout(r, 100));
    if (!sandstone.libcurl.ready) throw new Error("libcurl did not load");
    const wisp = await pickWisp(sandstone.network, say);
    log("[proxy] wisp", String(wisp));
    return { libcurl: sandstone.libcurl, network: sandstone.network, wisp: String(wisp) };
  })().catch((e) => { ready = null; throw e; }));
}

window.__getProxy = getProxy;

const STARFLEET = "https://login.nvidia.com";

const maskText = (s) => String(s)
  .replace(/eyJ[\w-]+\.[\w-]+\.[\w-]+/g, "<jwt>")
  .replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g, "<email>")
  .replace(/("(?:code|validation|otp|device_code|access_token|refresh_token|id_token|client_token|key)"\s*:\s*")[^"]*(")/g, "$1<hidden>$2")
  .replace(/((?:code|code_verifier|validation|key)=)[^&\s"]+/g, "$1<hidden>");
const logLines = [];
function log(...a) {
  const line = maskText(a.map((x) => (typeof x === "string" ? x : (() => { try { return JSON.stringify(x); } catch { return String(x); } })())).join(" "));
  logLines.push(line);
  if (logLines.length > 400) logLines.shift();
  $("log").textContent = logLines.join("\n");
  $("log").scrollTop = $("log").scrollHeight;
  console.log(line);
}

const loadStore = () => { try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch { return null; } };
const saveStore = (v) => { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch {} };

const jwt = (t) => {
  try {
    const p = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(atob(p).split("").map((c) => "%" + c.charCodeAt(0).toString(16).padStart(2, "0")).join("")));
  } catch { return {}; }
};

const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const rand = (n) => b64u(crypto.getRandomValues(new Uint8Array(n)));
const challengeOf = async (v) => b64u(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)));

const jar = [];
function cookieHeader(url) {
  const host = new URL(url).hostname;
  return jar.filter((c) => host === c.domain || host.endsWith("." + c.domain)).map((c) => c.name + "=" + c.value).join("; ");
}
function storeCookies(url, r) {
  const host = new URL(url).hostname;
  const raw = [];
  if (Array.isArray(r.raw_headers)) {
    for (const [k, v] of r.raw_headers) if (/^set-cookie$/i.test(k)) raw.push(v);
  } else if (r.headers && typeof r.headers.get === "function") {
    const v = r.headers.get("set-cookie");
    if (v) raw.push(...v.split(/,(?=\s*[^;,=\s]+=)/));
  }
  for (const line of raw) {
    const parts = line.split(";").map((p) => p.trim());
    const eq = parts[0].indexOf("=");
    if (eq < 1) continue;
    const name = parts[0].slice(0, eq), value = parts[0].slice(eq + 1);
    let domain = host;
    let expired = false;
    for (const p of parts.slice(1)) {
      const [k, v = ""] = p.split("=");
      if (/^domain$/i.test(k)) domain = v.replace(/^\./, "").toLowerCase();
      if (/^max-age$/i.test(k) && Number(v) <= 0) expired = true;
    }
    const i = jar.findIndex((c) => c.name === name && c.domain === domain);
    if (i >= 0) jar.splice(i, 1);
    if (!expired && value) jar.push({ name, value, domain });
  }
}

async function http(url, { method = "GET", headers = {}, body, follow = true, stopAt } = {}) {
  const { libcurl } = await window.__getProxy({ log, say });
  const chain = [];
  let cur = url, m = method, b = body, h0 = { ...headers };
  for (let i = 0; i < 12; i++) {
    const h = { ...h0 };
    const ck = cookieHeader(cur);
    if (ck) h.Cookie = ck;
    const init = { method: m, headers: h, redirect: "manual" };
    if (b !== undefined) init.body = b;
    const r = await libcurl.fetch(cur, init);
    storeCookies(cur, r);
    const text = await r.text();
    const loc = r.headers.get("location");
    const abs = loc ? new URL(loc, cur).href : null;
    chain.push(r.status + " " + new URL(cur).host + new URL(cur).pathname);
    if (follow && r.status >= 300 && r.status < 400 && abs) {
      if (stopAt && stopAt(abs)) return { status: r.status, url: cur, text, location: abs, chain };
      cur = abs;
      if (r.status === 303 || ((r.status === 301 || r.status === 302) && m === "POST")) {
        m = "GET";
        b = undefined;
        delete h0["Content-Type"];
      }
      continue;
    }
    return { status: r.status, url: cur, text, location: abs, chain };
  }
  throw new Error("Too many redirects");
}

let flow = null;
let run = 0;
let codeWaiter = null;

const cancelled = () => Object.assign(new Error("cancelled"), { cancelled: true });
const alive = (mine) => { if (mine !== run) throw cancelled(); };

async function beginFlow() {
  jar.length = 0;
  flow = null;
  const verifier = rand(48);
  const challenge = await challengeOf(verifier);
  const authUrl = STARFLEET + "/authorize?" + form({
    response_type: "code",
    device_id: DEVICE_ID,
    scope: SCOPE,
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT,
    ui_locales: "en_US",
    nonce: rand(16),
    prompt: "select_account",
    code_challenge: challenge,
    code_challenge_method: "S256",
  });
  log("[auth] authorize");
  const a = await http(authUrl, { headers: PAGE_HEADERS });
  log("[auth] chain", a.chain.join(" > "));
  const page = new URL(a.url);
  const state = page.searchParams.get("state");
  const idp = (page.searchParams.get("idp_ids") || "").split(/\s+/).filter(Boolean)[0];
  if (!state || !idp) throw new Error("NVIDIA did not return a sign-in provider (status " + a.status + ")");
  const p = await http(STARFLEET + "/callback/provider", {
    method: "POST",
    headers: { ...PAGE_HEADERS, "Content-Type": "application/x-www-form-urlencoded", Origin: STATIC_LOGIN, Referer: a.url },
    body: form({ state, idp_id: idp }),
    stopAt: (next) => new URL(next).hostname === LOGIN_HOST,
  });
  log("[auth] provider chain", p.chain.join(" > "));
  const key = p.location ? new URL(p.location).searchParams.get("key") : null;
  if (!key) throw new Error("NVIDIA did not start a login session (status " + p.status + ")");
  flow = { verifier, key, email: "" };
}

async function api(path, body, method = "POST", quiet = false) {
  if (!flow || !flow.key) throw new Error("No active sign-in session");
  const headers = {
    Accept: "application/json, text/plain, */*",
    Authorization: "Bearer " + flow.key,
    "x-metrics": JARVIS_METRICS,
    Origin: LOGIN_ORIGIN,
    Referer: LOGIN_ORIGIN + "/",
  };
  const init = { method, headers, follow: false };
  if (method === "POST") {
    headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body || {});
  }
  const r = await http(ACCOUNTS + path, init);
  let json = {};
  try { json = JSON.parse(r.text); } catch {}
  if (json && typeof json.key === "string") flow.key = json.key;
  const ok = r.status >= 200 && r.status < 300;
  if (!(quiet && r.status === 202)) log("[api]", method, path, r.status, r.text.slice(0, 400));
  return { status: r.status, ok, json, text: r.text };
}

const apiError = (r) => {
  const j = r.json || {};
  const msg = j.message || j.error_description || j.errorMessage || j.error || (j.errors && JSON.stringify(j.errors));
  return new Error(msg ? String(msg) : "NVIDIA returned " + r.status);
};

function askCode(title, desc, err) {
  $("code-title").textContent = title;
  $("code-desc").textContent = desc;
  $("code-error").textContent = err || "";
  $("code-error").hidden = !err;
  $("code").value = "";
  show("code-card");
  $("code").focus();
  return new Promise((resolve, reject) => { codeWaiter = { resolve, reject }; });
}

function askPassword(err) {
  $("pw-desc").textContent = "Signing in as " + flow.email + ".";
  $("pw-error").textContent = err || "";
  $("pw-error").hidden = !err;
  $("pw").value = "";
  show("password-card");
  $("pw").focus();
  return new Promise((resolve, reject) => { codeWaiter = { resolve, reject }; });
}

async function passwordStage(mine) {
  let err = "";
  for (let i = 0; i < 3; i++) {
    const password = await askPassword(err);
    alive(mine);
    setWait("Signing in…", "");
    const r = await api(EP.password, { password, rememberLogin: false, deviceId: JARVIS_DEVICE });
    if (r.ok) return;
    err = apiError(r).message;
  }
  throw new Error("Too many wrong passwords.");
}

async function selectFactor() {
  const r = await api(EP.factors, null, "GET");
  if (!r.ok) throw apiError(r);
  const list = Array.isArray(r.json) ? r.json : r.json.factors || r.json.values || [];
  const pick = list.find((f) => /email/i.test(f.type)) || list[0];
  if (!pick) throw new Error("NVIDIA offered no sign-in method for this account.");
  log("[auth] factors", list.map((f) => f.type).join(","), "using", pick.type);
  const id = pick.descriptors && pick.descriptors.length ? pick.descriptors[0].id : null;
  const init = await api(EP.init, { type: pick.type, id });
  if (!init.ok) throw apiError(init);
}

async function waitForEmail(mine) {
  setWait("Check your email", "NVIDIA sent a sign-in message to " + flow.email + ". Open the link in it and this page continues by itself.");
  const until = Date.now() + 10 * 60000;
  while (Date.now() < until) {
    await sleep(3000);
    alive(mine);
    const r = await api(EP.poll, null, "GET", true);
    if (r.status === 200) return;
    if (r.status === 400) throw new Error("The email sign-in was declined or expired.");
  }
  throw new Error("Timed out waiting for the email sign-in.");
}

async function totpChallenge(mine) {
  let err = "";
  for (let i = 0; i < 3; i++) {
    const code = await askCode("Enter your code", "Enter the code from your authenticator app.", err);
    alive(mine);
    setWait("Verifying…");
    const v = await api(EP.verify, { otp: code });
    if (v.ok) return;
    err = apiError(v).message;
  }
  throw new Error("Too many wrong codes.");
}

async function finishStage(page) {
  const url = page.externalUrl || ACCOUNTS + EP.next + "?key=" + encodeURIComponent(flow.key) + "&state=finish";
  const r = await http(url, { headers: { ...PAGE_HEADERS, Referer: LOGIN_ORIGIN + "/" }, stopAt: (next) => next.startsWith(REDIRECT) });
  log("[auth] finish chain", r.chain.join(" > "));
  if (r.location && r.location.startsWith(REDIRECT)) return r.location;
  throw new Error("NVIDIA did not complete the sign-in (status " + r.status + ")");
}

async function drive(mine) {
  let last = "", repeats = 0;
  for (let i = 0; i < 30; i++) {
    alive(mine);
    const n = await api(EP.next, {});
    if (!n.ok) throw apiError(n);
    const page = n.json.page || "";
    log("[auth] stage", page, JSON.stringify(n.json.values || {}).slice(0, 200));
    repeats = page === last ? repeats + 1 : 0;
    last = page;
    if (repeats >= 2) throw new Error("NVIDIA kept returning the " + page + " step. Open the debug log.");
    if (page === "Finish") return finishStage(n.json);
    if (page === "EnterPassword") { await passwordStage(mine); continue; }
    if (page === "NFactorChallengeSelect") { setWait("Contacting NVIDIA…", ""); await selectFactor(); continue; }
    if (page === "NFactorEmailAuthWait") { await waitForEmail(mine); continue; }
    if (page === "NFactorTOTPChallenge") { await totpChallenge(mine); continue; }
    if (page === "Consent") {
      if (!confirm("NVIDIA asks you to approve this app for your account. Approve?")) throw new Error("Approval was declined.");
      const c = await api(EP.consent, {});
      if (!c.ok) throw apiError(c);
      continue;
    }
    if (page === "CreateAccount" || page === "ThirdPartyAccountCreate") throw new Error("No NVIDIA account exists for that email. This client only signs in to existing accounts.");
    if (page === "Captcha") throw new Error("NVIDIA wants a captcha for this sign-in, which this client can't show yet.");
    if (page === "LogIn" || page === "AccountCheck") {
      const err = n.json.values && n.json.values.jarvis_error;
      throw new Error(err ? "NVIDIA said: " + (err.error || JSON.stringify(err)) : "NVIDIA sent you back to the sign-in step.");
    }
    throw new Error("NVIDIA asked for a step this client does not handle yet: " + (page || "unknown") + ". Open the debug log.");
  }
  throw new Error("Sign-in took too many steps.");
}

async function claimTokens(landed) {
  if (!landed.startsWith(REDIRECT)) throw new Error("NVIDIA did not hand back an authorization code");
  const code = new URL(landed).searchParams.get("code");
  if (!code) throw new Error("NVIDIA did not hand back an authorization code");
  const t = await http(STARFLEET + "/token", {
    method: "POST",
    headers: TOKEN_HEADERS,
    body: form({ grant_type: "authorization_code", code, redirect_uri: REDIRECT, code_verifier: flow.verifier, client_id: CLIENT_ID, device_id: DEVICE_ID }),
    follow: false,
  });
  let json = {};
  try { json = JSON.parse(t.text); } catch {}
  log("[auth] token", t.status);
  if (t.status < 200 || t.status >= 300 || !json.access_token) throw new Error(json.error_description || json.error || "Token exchange failed (" + t.status + ")");
  return json;
}

async function userinfo(token) {
  const r = await http(STARFLEET + "/userinfo", { headers: { Authorization: "Bearer " + token, Accept: "application/json" }, follow: false });
  try { return JSON.parse(r.text); } catch { return {}; }
}

async function startLogin(email) {
  const mine = ++run;
  await beginFlow();
  alive(mine);
  flow.email = email;
  const first = await api(EP.check, { email, rememberLogin: false, deviceId: JARVIS_DEVICE });
  if (!first.ok) throw apiError(first);
  const landed = await drive(mine);
  alive(mine);
  return claimTokens(landed);
}

function setError(id, t) {
  const e = $(id);
  e.textContent = t || "";
  e.hidden = !t;
}

async function onEmail(ev) {
  ev.preventDefault();
  setError("email-error", "");
  const email = $("email").value.trim();
  setWait("Contacting NVIDIA…", "");
  try {
    const tokens = await startLogin(email);
    await finish(tokens);
    flow = null;
  } catch (e) {
    if (e && e.cancelled) return;
    log("[auth] failed", (e && e.message) || e);
    flow = null;
    setError("email-error", e && e.message ? e.message : String(e));
    show("email-card");
  }
}

function onCode(ev) {
  ev.preventDefault();
  if (!codeWaiter) return;
  const w = codeWaiter;
  codeWaiter = null;
  w.resolve($("code").value.trim());
}

function cancelLogin() {
  run++;
  if (codeWaiter) {
    codeWaiter.reject(cancelled());
    codeWaiter = null;
  }
  flow = null;
  setError("email-error", "");
  show("email-card");
}

async function finish(tokens) {
  let user = {};
  try { user = await userinfo(tokens.access_token); } catch {}
  const claims = tokens.id_token ? jwt(tokens.id_token) : {};
  const session = {
    at: Date.now(),
    tokens,
    user: {
      sub: user.sub || claims.sub || "",
      email: user.email || claims.email || (flow && flow.email) || "",
      email_verified: user.email_verified ?? claims.email_verified ?? null,
      name: user.preferred_username || user.name || claims.preferred_username || claims.name || "",
    },
  };
  saveStore(session);
  render(session);
}

function render(session) {
  if (!session) { show("email-card"); return; }
  const u = session.user || {};
  $("acct-email").textContent = u.email || "(no email returned)";
  $("acct-name").textContent = u.name || u.sub || "";
  const v = $("acct-verified");
  v.textContent = u.email_verified === true ? "Email verified" : u.email_verified === false ? "Email not verified" : "Verification status unknown";
  v.className = "badge " + (u.email_verified === true ? "ok" : u.email_verified === false ? "warn" : "");
  const exp = session.tokens.expires_in ? new Date(session.at + session.tokens.expires_in * 1000) : null;
  $("acct-exp").textContent = exp ? "Access token valid until " + exp.toLocaleString() : "";
  show("account");
}

function signOut() {
  run++;
  flow = null;
  saveStore(null);
  setError("email-error", "");
  show("email-card");
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); const o = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = o), 1200); } catch {}
}

$("email-form").addEventListener("submit", onEmail);
$("code-form").addEventListener("submit", onCode);
$("pw-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (!codeWaiter) return;
  const w = codeWaiter;
  codeWaiter = null;
  w.resolve($("pw").value);
});
$("pw-cancel").addEventListener("click", cancelLogin);
$("cancel").addEventListener("click", cancelLogin);
$("back").addEventListener("click", cancelLogin);
$("signout").addEventListener("click", signOut);
$("copy-token").addEventListener("click", (e) => { const s = loadStore(); if (s) copy(s.tokens.access_token, e.currentTarget); });
$("copy-log").addEventListener("click", (e) => copy(logLines.join("\n"), e.currentTarget));

const existing = loadStore();
if (existing) render(existing);
else show("email-card");
window.__getProxy({ log, say }).catch((e) => log("[proxy] failed", (e && e.message) || e));
</script>
</body>
</html>
